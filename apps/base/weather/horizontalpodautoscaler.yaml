apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weather-primary
  namespace: weather
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-primary
  minReplicas: 2
  maxReplicas: 2
  metrics:
    # Scale based on CPU utilization
    # - type: Resource
    #   resource:
    #     name: cpu
    #     target:
    #       type: Utilization
    #       averageUtilization: 70
    # Scale based on RPS from Prometheus (via prometheus-adapter)
    - type: External
      external:
        metric:
          name: weather_requests_per_second
        target:
          type: AverageValue
          averageValue: "100" # Target 100 RPS per replica
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0 # Scale up immediately when needed
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
