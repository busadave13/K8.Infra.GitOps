apiVersion: v1
kind: LimitRange
metadata:
  name: weather-limits
  namespace: weather
spec:
  limits:
    - type: Container
      default:
        #cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "500m"
        memory: 1Gi
    - type: Pod
      max:
        cpu: "1"
        memory: 1Gi
 