apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo-canary
spec:
  provider: istio
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  progressDeadlineSeconds: 60
  service:
    port: 9898
    targetPort: 9898
    portName: http
    trafficPolicy:
      tls:
        mode: ISTIO_MUTUAL
  analysis:
    interval: 1m
    threshold: 5
    maxWeight: 100
    stepWeight: 10
    metrics:
      - name: success-rate
        templateRef:
          name: request-success-rate
          namespace: flagger-system
        thresholdRange:
          min: 99
        interval: 1m
      - name: latency-p99
        templateRef:
          name: request-duration
          namespace: flagger-system
        thresholdRange:
          max: 500
        interval: 1m
    webhooks:
      - name: acceptance-test
        type: pre-rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 30s
        metadata:
          type: bash
          cmd: "curl -sd 'test' http://podinfo-canary.podinfo:9898/token | grep token"
      - name: load-test
        url: http://k6-webhook.flagger-system/launch-test
        timeout: 5m
        metadata:
          script: |
            import http from 'k6/http';
            import { check, sleep } from 'k6';
            export const options = {
              vus: 5,
              duration: '30s',
              thresholds: {
                'http_req_failed': ['rate<0.01'],
                'http_req_duration': ['p(95)<500'],
              },
            };
            export default function () {
              const res = http.get('http://podinfo-canary.podinfo:9898/');
              check(res, {
                'status is 200': (r) => r.status === 200,
              });
              sleep(0.5);
            }
