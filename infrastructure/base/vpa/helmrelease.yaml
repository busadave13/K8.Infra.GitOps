apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-system
  chart:
    spec:
      chart: vpa
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Recommender - analyzes resource usage and provides recommendations
    recommender:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      extraArgs:
        # Use metrics-server for resource metrics
        prometheus-address: ""
        storage: prometheus
        # Recommendation parameters
        pod-recommendation-min-cpu-millicores: 25
        pod-recommendation-min-memory-mb: 32
        # History window for recommendations
        cpu-histogram-decay-half-life: 24h0m0s
        memory-histogram-decay-half-life: 24h0m0s

    # Updater - evicts pods for VPA to apply new resource requests
    # Disabled since we're using "Off" mode
    updater:
      enabled: false

    # Admission Controller - mutates pod resource requests on creation
    # Disabled since we're using "Off" mode
    admissionController:
      enabled: false

    # CRDs will be installed by the chart
    crds:
      install: true
