            { "datasource": "Prometheus", "expr": "histogram_quantile(0.50, sum(rate(pilot_xds_push_time_bucket[5m])) by (le))", "legendFormat": "P50", "refId": "A" },
            { "datasource": "Prometheus", "expr": "histogram_quantile(0.90, sum(rate(pilot_xds_push_time_bucket[5m])) by (le))", "legendFormat": "P90", "refId": "B" },
