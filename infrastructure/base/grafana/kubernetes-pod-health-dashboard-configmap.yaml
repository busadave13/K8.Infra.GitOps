                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-background"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "CrashLoopBackOff": {
                            "color": "red",
                            "index": 0
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "ImagePullBackOff": {
                            "color": "orange",
                            "index": 1
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "ErrImagePull": {
                            "color": "orange",
                            "index": 2
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "ContainerCreating": {
                            "color": "yellow",
                            "index": 3
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "PodInitializing": {
                            "color": "blue",
                            "index": 4
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "id": 9,
          "options": {
            "footer": {
              "enablePagination": true,
              "fields": "",
              "reducer": ["sum"],
              "show": false
            },
            "showHeader": true,
            "sortBy": []
