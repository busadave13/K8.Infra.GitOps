apiVersion: v1
kind: ConfigMap
metadata:
  name: flagger-canary-overview
  namespace: monitor
  labels:
    grafana_dashboard: "1"
data:
  flagger-canary-overview.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "displayMode": "auto",
                "filterable": true,
                "inspect": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Canary Weight"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.displayMode",
                    "value": "gradient-gauge"
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 25
                        },
                        {
                          "color": "orange",
                          "value": 50
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Primary Weight"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.displayMode",
                    "value": "gradient-gauge"
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "blue",
                          "value": null
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 6,
          "options": {
            "footer": {
              "enablePagination": true,
              "fields": "",
              "reducer": ["sum"],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Canary"
              }
            ]
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "max by (name, exported_namespace) (label_replace(flagger_canary_weight{workload!~\".*-primary\"}, \"name\", \"$1\", \"workload\", \"(.*)\") or label_replace(flagger_canary_status * 0, \"name\", \"$1\", \"name\", \"(.*)\"))",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "label_replace(max by (destination_workload, destination_workload_namespace, destination_version) (istio_requests_total{destination_workload=~\".*-primary\", reporter=\"destination\"}), \"name\", \"$1\", \"destination_workload\", \"(.*)-primary\")",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "title": "Canary Deployments",
          "transformations": [
            {
              "id": "seriesToColumns",
              "options": {
                "byField": "name"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "instance": true,
                  "instance 1": true,
                  "instance 2": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "namespace": true,
                  "namespace 1": true,
                  "namespace 2": true,
                  "pod": true,
                  "pod 1": true,
                  "pod 2": true,
                  "workload": true,
                  "exported_namespace 2": true,
                  "destination_workload": true,
                  "destination_workload_namespace": true,
                  "Value #B": true
                },
                "indexByName": {},
                "renameByName": {
                  "Value #A": "Canary Weight",
                  "exported_namespace": "Namespace",
                  "exported_namespace 1": "Namespace",
                  "name": "Canary",
                  "destination_version": "Version"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "alias": "Primary Weight",
                "binary": {
                  "left": "100",
                  "operator": "-",
                  "right": "Canary Weight"
                },
                "mode": "binary",
                "reduce": {
                  "reducer": "sum"
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "Canary": 0,
                  "Namespace": 1,
                  "Version": 2,
                  "Primary Weight": 3,
                  "Canary Weight": 4
                },
                "renameByName": {}
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "flagger_canary_weight",
              "legendFormat": "{{workload}} ({{exported_namespace}})",
              "refId": "A"
            }
          ],
          "title": "Canary Weight Over Time",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["flagger", "canary"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"]
      },
      "timezone": "",
      "title": "Flagger Canary Overview",
      "uid": "flagger-canary-overview",
      "version": 1
    }
