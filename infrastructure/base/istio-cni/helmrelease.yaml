apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  chart:
    spec:
      chart: cni
      version: "1.26.4"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cni:
      ambient:
        enabled: false
      cniBinDir: /opt/cni/bin
      cniConfDir: /etc/cni/net.d
      cniConfFileName: "10-calico.conflist"
      chained: true
      logLevel: info
      repair:
        enabled: true
