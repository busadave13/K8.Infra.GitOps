apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
  namespace: flux-system
spec:
  releaseName: prometheus-adapter
  targetNamespace: monitor
  chart:
    spec:
      chart: prometheus-adapter
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
  interval: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      url: http://prometheus-server.monitor.svc.cluster.local
      port: 80

    # Custom metrics rules for RPS-based HPA
    # Note: Filter by job="kubernetes-pods" to avoid double-counting metrics from envoy-stats job
    rules:
      default: false
      custom:
        # Requests per second per pod for Istio-instrumented services
        - seriesQuery: 'istio_requests_total{destination_workload!="",destination_workload_namespace!="",job="kubernetes-pods"}'
          resources:
            overrides:
              destination_workload_namespace:
                resource: namespace
              destination_workload:
                resource: pod
          name:
            matches: "^(.*)_total$"
            as: "${1}_per_second"
          metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>,job="kubernetes-pods"}[2m])) by (<<.GroupBy>>)'

      # External metrics for HPA (namespace-scoped aggregations)
      # Note: Filter by reporter="destination" to count only at destination side and avoid double-counting
      external:
        # RPS for podinfo-primary (used by HPA)
        - seriesQuery: 'istio_requests_total{destination_workload="podinfo-primary",destination_workload_namespace="podinfo",job="kubernetes-pods",reporter="destination"}'
          resources:
            overrides:
              destination_workload_namespace:
                resource: namespace
          name:
            matches: ""
            as: "podinfo_requests_per_second"
          metricsQuery: 'sum(rate(istio_requests_total{destination_workload="podinfo-primary",destination_workload_namespace="podinfo",job="kubernetes-pods",reporter="destination"}[2m]))'

        # RPS for weather-primary (used by HPA)
        - seriesQuery: 'istio_requests_total{destination_workload="weather-primary",destination_workload_namespace="weather",job="kubernetes-pods",reporter="destination"}'
          resources:
            overrides:
              destination_workload_namespace:
                resource: namespace
          name:
            matches: ""
            as: "weather_requests_per_second"
          metricsQuery: 'sum(rate(istio_requests_total{destination_workload="weather-primary",destination_workload_namespace="weather",job="kubernetes-pods",reporter="destination"}[2m]))'

    # Resource requests/limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
