apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flagger-loadtester
  targetNamespace: flagger-system
  dependsOn:
    - name: flagger
      namespace: flux-system
  chart:
    spec:
      chart: loadtester
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Enable additional load testing tools
    cmd:
      timeout: 1h
