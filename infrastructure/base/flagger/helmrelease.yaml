apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flagger
  targetNamespace: flagger-system
  dependsOn:
    - name: istiod
      namespace: flux-system
  chart:
    spec:
      chart: flagger
      version: "1.42.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    meshProvider: istio
    metricsServer: https://amw-azr-staging-wus2-apa7cuf8ddhwhrfr.westus2.prometheus.monitor.azure.com
    slack:
      user: flagger
      channel: k8-local-dev
    env:
      - name: SLACK_URL
        valueFrom:
          secretKeyRef:
            name: discord-webhook
            key: address
      # Configure ServiceAccount for Workload Identity
    serviceAccount:
      create: false
      name: flagger-sa
    # Disable built-in prometheus since we're using Azure Managed Prometheus
    prometheus:
      enabled: false
    podMonitor:
      enabled: true
      namespace: flagger
      additionalLabels:
        release: azure-monitor
