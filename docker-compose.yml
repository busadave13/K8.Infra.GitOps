name: k8-local-dev

services:
  # ============================================
  # Aspire Dashboard
  # ============================================
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-standalone
    restart: unless-stopped
    ports:
      - "18888:18888" # Dashboard UI
      - "18889:18889" # OTLP gRPC endpoint
      - "18890:18890" # OTLP HTTP endpoint
    environment:
      - DOTNET_LOGS_CONSOLE_FORMAT=Json
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL=http://+:18889
      - ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL=http://+:18890
      - ASPIRE_DASHBOARD_FRONTEND_AUTH_MODE=Unsecured
      - ASPIRE_DASHBOARD_RESOURCE_SERVICE_ENDPOINT_URL=http://+:18891
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - aspire_dashboard_data:/app/data
    networks:
      - k8dev_network

  # ============================================
  # k6 - Load testing tool
  # ============================================
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./k6:/scripts
    networks:
      - k8dev_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mockery.local.com:host-gateway"
      - "podinfo.local.com:host-gateway"
      - "weather.local.com:host-gateway"
    # Command will be provided when running: docker-compose run k6 run ...
    entrypoint: ["k6"]

networks:
  k8dev_network:
    driver: bridge
    name: k8dev_network

volumes:
  aspire_dashboard_data:
    driver: local
