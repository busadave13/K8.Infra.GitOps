apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation-crds
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev
  prune: false
  wait: true
  patches:
    - target:
        kind: Kustomization
      patch: |-
        - op: replace
          path: /metadata/name
          value: image-automation-crds
        - op: replace
          path: /spec/path
          value: ./clusters/dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./image-automation
  prune: true
  wait: true
  dependsOn:
    - name: image-automation-crds
