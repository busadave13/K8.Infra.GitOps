apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/staging
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  prune: true
  wait: true
