apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/staging
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: ingress
